function planks(c1, c2, seam, w = 132, vertical = true) {
  let s = `<rect width="1080" height="1920" fill="${c1}"/>`;
  for (let i = 0; i * w < 1080 + w; i++) {
    const x = i * w, off = (i * 397) % 1920;
    s += `<rect x="${x}" y="0" width="${w}" height="1920" fill="${i % 2 ? c2 : c1}"/>`;
    s += `<line x1="${x}" y1="0" x2="${x}" y2="1920" stroke="${seam}" stroke-width="3"/>`;
    for (let k = 0; k < 3; k++) { const y = (off + k * 680) % 1920; s += `<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y}" stroke="${seam}" stroke-width="3"/>`; }
    for (let k = 0; k < 4; k++) { const gy = (off * 1.7 + k * 470) % 1920; s += `<path d="M${x + 18} ${gy} q${w / 3} 40 ${w - 36} 10" fill="none" stroke="${seam}" stroke-opacity=".25" stroke-width="2"/>`; }
  }
  return s;
}
function tiles(c1, grout, size = 190) {
  let s = `<rect width="1080" height="1920" fill="${c1}"/>`;
  for (let x = -20; x < 1080; x += size) s += `<line x1="${x}" y1="0" x2="${x}" y2="1920" stroke="${grout}" stroke-width="4"/>`;
  for (let y = -40; y < 1920; y += size) s += `<line x1="0" y1="${y}" x2="1080" y2="${y}" stroke="${grout}" stroke-width="4"/>`;
  for (let i = 0; i < 30; i++) s += `<circle cx="${(i * 311) % 1080}" cy="${(i * 577) % 1920}" r="${30 + i % 4 * 18}" fill="#fff" opacity=".035"/>`;
  return s;
}

// ---------- the prayer rug (ours) ----------

  const x0 = 310, y0 = 640, w = 460, h = 860, x1 = x0 + w;
  let s = `<g filter="url(#shadow)">`;
  for (let i = 0; i < 24; i++) { const x = x0 + 14 + i * 18.6; s += `<line x1="${x}" y1="${y0 - 16}" x2="${x}" y2="${y0}" stroke="${IV}" stroke-width="4"/><line x1="${x}" y1="${y0 + h}" x2="${x}" y2="${y0 + h + 16}" stroke="${IV}" stroke-width="4"/>`; }
  s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="6" fill="#174532"/></g>`;
  s += `<rect x="${x0 + 12}" y="${y0 + 12}" width="${w - 24}" height="${h - 24}" fill="none" stroke="${IV}" stroke-width="3"/>`;
  s += `<rect x="${x0 + 22}" y="${y0 + 22}" width="${w - 44}" height="${h - 44}" fill="#0f3325"/>`;
  for (let i = 0; i < 22; i++) { s += `<circle cx="${x0 + 34 + i * 18.6}" cy="${y0 + 34}" r="3" fill="${GD}"/><circle cx="${x0 + 34 + i * 18.6}" cy="${y0 + h - 34}" r="3" fill="${GD}"/>`; }
  for (let i = 0; i < 42; i++) { s += `<circle cx="${x0 + 34}" cy="${y0 + 52 + i * 18.6}" r="3" fill="${GD}"/><circle cx="${x1 - 34}" cy="${y0 + 52 + i * 18.6}" r="3" fill="${GD}"/>`; }
  s += `<rect x="${x0 + 48}" y="${y0 + 48}" width="${w - 96}" height="${h - 96}" fill="#1a4d38" stroke="${IV}" stroke-opacity=".6" stroke-width="2"/>`;
  const ax0 = x0 + 92, ax1 = x1 - 92, ab = y0 + 560, as = y0 + 290, apex = y0 + 120;
  s += `<path d="M${ax0} ${ab} L${ax0} ${as} C${ax0} ${as - 90} 540 ${apex + 50} 540 ${apex} C540 ${apex + 50} ${ax1} ${as - 90} ${ax1} ${as} L${ax1} ${ab} Z" fill="#205a42" stroke="${GD}" stroke-width="5"/>`;
  s += `<path d="M${ax0 + 22} ${ab - 16} L${ax0 + 22} ${as + 6} C${ax0 + 22} ${as - 70} 540 ${apex + 76} 540 ${apex + 30} C540 ${apex + 76} ${ax1 - 22} ${as - 70} ${ax1 - 22} ${as + 6} L${ax1 - 22} ${ab - 16} Z" fill="none" stroke="${IV}" stroke-opacity=".45" stroke-width="2"/>`;
  s += `<line x1="540" y1="${apex + 30}" x2="540" y2="${apex + 96}" stroke="${GD}" stroke-width="2.5"/><path d="M528 ${apex + 96} L552 ${apex + 96} L560 ${apex + 120} L540 ${apex + 138} L520 ${apex + 120} Z" fill="${GD}"/>`;
  [[480, as + 40], [600, as + 40], [540, as + 130], [480, as + 220], [600, as + 220]].forEach(([x, y]) => s += `<path d="M${x} ${y - 14} L${x + 4} ${y - 4} L${x + 14} ${y} L${x + 4} ${y + 4} L${x} ${y + 14} L${x - 4} ${y + 4} L${x - 14} ${y} L${x - 4} ${y - 4} Z" fill="${GD}" opacity=".85"/>`);
  s += `<rect x="${x0 + 70}" y="${y0 + 600}" width="${w - 140}" height="${h - 670}" fill="url(#stars)" stroke="${IV}" stroke-opacity=".6" stroke-width="2"/>`;
  s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" filter="url(#grain)" opacity=".8"/>`;
  return s;
}

// ---------- hands (neutral sleeves) ----------
function hand(cx, cy, rot, mirror) {
  const fing = [[-40, 70, -10], [-14, 90, -4], [12, 96, 1], [38, 86, 6]];
  let f = fing.map(([x, l, a]) => `<g transform="translate(${x} 0) rotate(${a})"><rect x="-13" y="${-l}" width="26" height="${l + 20}" rx="13" fill="${SKIN}" stroke="${SKIN_D}" stroke-width="2"/><rect x="-8" y="${-l + 4}" width="16" height="16" rx="7" fill="#e2c1a3" opacity=".8"/></g>`).join("");
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${mirror ? -1 : 1} 1)" filter="url(#shadow)">
    <path d="M-72 92 L72 92 L104 700 L-104 700 Z" fill="${SLEEVE}"/><path d="M-72 92 L72 92 L76 128 L-76 128 Z" fill="${SLEEVE_D}"/>
    <path d="M-30 130 L-40 700 M24 130 L34 700" stroke="${SLEEVE_D}" stroke-width="4" opacity=".5"/>
    ${f}
    <g transform="translate(46 52) rotate(58)"><rect x="-15" y="-64" width="30" height="76" rx="15" fill="${SKIN}" stroke="${SKIN_D}" stroke-width="2"/><rect x="-9" y="-58" width="18" height="16" rx="7" fill="#e2c1a3" opacity=".8"/></g>
    <path d="M-58 0 C-60 50 -56 90 -50 100 L50 100 C60 80 62 40 58 0 Z" fill="${SKIN}" stroke="${SKIN_D}" stroke-width="2"/>
    <path d="M-50 4 L50 4" stroke="${SKIN_D}" stroke-opacity=".25" stroke-width="3"/></g>`;
}

// ---------- scenes ----------
const SCN = {
  fajr: { floor: planks("#2b2f38", "#30343e", "#1f222a"), props: P.bed() + P.phone(905, 600, 16, true) + P.slippers(160, 1420, -14, "#9aa0ad"),
          light: `<rect width="1080" height="1920" fill="#1a2546" opacity=".62" style="mix-blend-mode:multiply"/><circle cx="905" cy="600" r="380" fill="url(#gCool)" class="pulse" style="mix-blend-mode:screen"/>` },
  dhuhr: { floor: planks("#b98d5c", "#b28655", "#8f6a43"), props: P.laptop(880, 330, -8) + P.chair(110, 1080) + P.mug(150, 560) + P.papers(930, 1060, 12),
          light: `<rect width="1080" height="1920" fill="#fff4dc" opacity=".12" style="mix-blend-mode:screen"/>` + P.window("0,0 520,0 1080,760 1080,1180", "#fff7e0", .16) + P.window("0,300 260,300 900,1920 520,1920", "#fff7e0", .1) },
  asr: { floor: planks("#7a4e33", "#744a30", "#5a3824") + carpet("#7a4e33", "#a0472d"), props: P.cushion(140, 610, -12, "#d9b45a") + P.teaGlass(930, 1240) + P.watch(150, 1330, 28, 4.6) + P.book(920, 640, 14, "#6d2f22"),
          light: `<rect width="1080" height="1920" fill="#ff9e4a" opacity=".22" style="mix-blend-mode:multiply"/>` + P.window("1080,0 1080,520 -200,1500 -200,900", "#ffcf7a", .22) + P.window("1080,700 1080,980 200,1920 -40,1920", "#ffcf7a", .14) },
  maghrib: { floor: tiles("#d8c7a8", "#b9a685"), props: P.bag(150, 560, -18) + P.shoes(930, 1330, 8) + P.keys(190, 1260, 30) + P.papers(930, 520, 18, 1),
          light: `<rect width="1080" height="1920" fill="#7d4c6a" opacity=".38" style="mix-blend-mode:multiply"/><circle cx="1000" cy="80" r="700" fill="url(#gWarm)" opacity=".55" style="mix-blend-mode:screen"/>` },
  isha: { floor: planks("#3a2a20", "#35271e", "#261b14"), props: P.glasses(150, 560, -12) + P.book(150, 1150, -8) + P.cup(930, 1240),
          light: `<rect width="1080" height="1920" fill="#20140c" opacity=".55" style="mix-blend-mode:multiply"/><circle cx="960" cy="420" r="520" fill="url(#gWarm)" opacity=".85" style="mix-blend-mode:screen"/>` },
  low: { floor: planks("#5d6066", "#585b61", "#45474c"), props: P.crumple(150, 600, 1.4, 10) + P.crumple(240, 760, 1, 70) + P.crumple(110, 1300, 1.2, -30) + P.book(920, 640, 6, "#3e4b57") + P.mug(930, 1300, "#c9c4bb", "#3a2a1e"),
          light: `<rect width="1080" height="1920" fill="#2e3b52" opacity=".45" style="mix-blend-mode:multiply"/>` + [0, 1, 2, 3, 4].map(i => P.window(`${200 + i * 120},0 ${240 + i * 120},0 ${-60 + i * 120},1920 ${-100 + i * 120},1920`, "#cfd8e8", .06)).join("") },
  broken: { floor: planks("#4b3d4a", "#463946", "#352a35"), props: P.phoneDown(150, 640, -22) + P.tissue(940, 560, 1.1, 20) + P.tissue(980, 760, .9, -40) + P.tissue(130, 1350, 1, 60) + P.mug(930, 1300, "#bdb6c4", "#2a201a"),
          light: `<rect width="1080" height="1920" fill="#3a2440" opacity=".45" style="mix-blend-mode:multiply"/>` },
  joy: { floor: planks("#c9a273", "#c19a6b", "#a07b52"), props: P.leaf(-30, 520, -20, 1.2) + P.leaf(-40, 560, 25, 1.1) + P.leaf(40, 470, 60, .9) + P.flowers(930, 1250) + P.slippers(930, 620, 10, "#f2ece0"),
          light: `<rect width="1080" height="1920" fill="#fff4d6" opacity=".16" style="mix-blend-mode:screen"/>` + P.window("1080,200 1080,620 220,1920 -60,1920", "#fff3cf", .2) + P.window("1080,820 1080,1000 600,1920 420,1920", "#fff3cf", .14) },
  grateful: { floor: carpet("#4a3420", "#7a2f25"), props: P.dates(160, 600) + P.water(300, 470) + P.mushaf(900, 600, -6) + P.beads(150, 1330),
          light: `<rect width="1080" height="1920" fill="#ffcf73" opacity=".16" style="mix-blend-mode:screen"/><circle cx="540" cy="900" r="900" fill="url(#gWarm)" opacity=".35" style="mix-blend-mode:screen"/>` },
  anyway: { floor: planks("#24262b", "#22242a", "#16181c"), props: P.slippers(160, 1420, -14, "#6d717a"),
          light: `<rect width="1080" height="1920" fill="#0c1016" opacity=".78" style="mix-blend-mode:multiply"/><ellipse cx="540" cy="1080" rx="460" ry="720" fill="url(#gSpot)" class="spot" style="mix-blend-mode:screen"/>` },
};
SCN.hadith = SCN.anyway; SCN.logo = SCN.anyway;

const scenesG = $("scenes"), lightsG = $("lights");
const built = {};
for (const k in SCN) {
  if (SCN[k].g) continue;
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("opacity", 0); g.innerHTML = SCN[k].floor + SCN[k].props; scenesG.appendChild(g);
  const l = document.createElementNS("http://www.w3.org/2000/svg", "g"); l.setAttribute("opacity", 0); l.innerHTML = SCN[k].light; lightsG.appendChild(l);
  SCN[k].g = g; SCN[k].l = l;
}
$("rug").innerHTML = rug();
$("hands").innerHTML = hand(404, 1296, 6, false) + hand(676, 1296, -6, true);

$("who").textContent = D.hadith.who;
$("ar").textContent = D.hadith.ar;
$("en").innerHTML = D.hadith.en_html;
$("ref").textContent = D.hadith.ref;

const S = D.scenes;
function render(t) {
  const i = S.findIndex((s, k) => t >= s.t && (k + 1 === S.length || t < S[k + 1].t));
  const cur = S[Math.max(0, i)], nxt = S[i + 1];
  const lt = t - cur.t, dur = (nxt ? nxt.t : cur.t + 3) - cur.t;
  // scene visibility: quick 0.12 s crossfade at each cut
  for (const k in SCN) { if (!SCN[k].g) continue; SCN[k].g.setAttribute("opacity", 0); SCN[k].l.setAttribute("opacity", 0); }
  const showScene = (key, o) => { const sc = SCN[key]; const g = sc.g || SCN.anyway.g, l = sc.l || SCN.anyway.l; g.setAttribute("opacity", Math.max(+g.getAttribute("opacity"), o)); l.setAttribute("opacity", Math.max(+l.getAttribute("opacity"), o)); };
  const prev = S[i - 1];
  const fadeIn = ramp(lt, 0, .12);
  if (prev && fadeIn < 1) showScene(prev.key, 1);
  showScene(cur.key, fadeIn);
  // camera: slow push-in per scene; the climax pushes a little more
  const push = cur.key === "anyway" ? .07 * ease(ramp(lt, 0, 2.6)) : .035 * (lt / dur);
  $("cam").setAttribute("transform", `translate(540 1000) scale(${1.02 + push}) translate(-540 -1000)`);
  // small life in each scene
  document.querySelectorAll(".pulse").forEach(p => p.setAttribute("opacity", .78 + .22 * Math.sin(t * 9)));
  // climax and later: dark room, single soft light
  const hadT = S.find(s => s.key === "hadith").t, logoT = S.find(s => s.key === "logo").t;
  $("dim").setAttribute("opacity", .72 * ramp(t, hadT, .6) + .25 * ramp(t, logoT, .5));
  // text
  const txt = cur.text || "";
  const lab = $("label"), line = $("line");
  if (line.dataset.k != i) { line.innerHTML = txt; lab.textContent = cur.label || ""; line.dataset.k = i; }
  const tin = cur.key === "anyway" ? ramp(lt, .25, .35) : ramp(lt, .04, .16);
  const tout = 1 - ramp(t, (nxt ? nxt.t : 1e9) - .1, .1);
  line.style.opacity = tin * tout; lab.style.opacity = tin * tout;
  line.style.transform = `translateY(${(1 - ease(tin)) * 16}px)`;
  if (cur.key === "anyway") { line.style.top = "352px"; line.style.fontSize = "112px"; } else { line.style.top = "352px"; line.style.fontSize = "86px"; }
  // hadith card: label, Arabic, English, then the last clause turns gold, then the reference
  const c = $("card");
  c.style.opacity = ramp(t, hadT + .25, .5) * (1 - ramp(t, logoT - .3, .3));
  $("who").style.opacity = ramp(t, hadT + .25, .4); $("ar").style.opacity = ramp(t, hadT + .7, .5);
  $("en").style.opacity = ramp(t, hadT + 1.2, .5);
  const hl = document.querySelector("#en .hl"); if (hl) hl.style.color = ramp(t, hadT + D.hadith.hl_at, .35) > .5 ? "#e8c66a" : "#f6efdc";
  $("ref").style.opacity = ramp(t, hadT + D.hadith.hl_at + .3, .4);
  $("logo").style.opacity = ramp(t, logoT + .15, .5);
  $("handle").style.opacity = .6 * (1 - ramp(t, logoT, .3));
  // hands rest during the hadith and the logo
  $("hands").setAttribute("opacity", 1 - .0 * ramp(t, hadT, .5));
}
window.render = render;
window.ready = document.fonts.ready.then(() => { render(0); return true; });
</script>

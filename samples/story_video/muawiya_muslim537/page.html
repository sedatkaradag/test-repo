<script>
const D = __DATA__;
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const ramp = (t, t0, d) => ease((t - t0) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const C = D.cue;

// ---------- people, seen from behind and a little above (no faces anywhere) ----------
// head: dark hair with a cap (kufi) or a small turban on top; turn = -1..1 turns the head so a cheek edge shows
function headTop(c, turn = 0, outline = false) {
  const sx = turn * 9, rot = turn * 14;
  const st = outline ? `stroke="#0b1a17" stroke-width="5"` : "";
  const cheek = turn === 0 ? "" : `<path transform="scale(${Math.sign(turn)} 1)" d="M30 -414 C44 -404 46 -380 34 -362 C28 -356 20 -356 16 -362 C26 -378 28 -398 22 -412 Z" fill="${c.skin}"/>
      <path transform="scale(${Math.sign(turn)} 1)" d="M34 -372 C30 -360 22 -356 16 -362 C18 -366 22 -370 24 -374 Z" fill="${c.hair}" opacity=".9"/>`;
  const cap = c.turban
    ? `<ellipse cx="0" cy="-418" rx="47" ry="33" fill="${c.cap}" ${st}/>
       <path d="M-44 -424 C-20 -404 20 -404 44 -424 M-40 -436 C-16 -418 16 -418 40 -436" stroke="${c.capShade}" stroke-width="5" fill="none" opacity=".7"/>`
    : `<ellipse cx="0" cy="-416" rx="41" ry="30" fill="${c.cap}" ${st}/>
       <ellipse cx="0" cy="-421" rx="27" ry="18" fill="none" stroke="${c.capShade}" stroke-width="3" opacity=".8"/>
       <ellipse cx="0" cy="-424" rx="11" ry="7" fill="${c.capShade}" opacity=".6"/>`;
  return `<g transform="rotate(${rot} 0 -390) translate(${sx} 0)">
      <ellipse cx="0" cy="-392" rx="40" ry="42" fill="${c.hair}" ${st}/>${cheek}${cap}</g>`;
}
// shoulders and back; arms only show in the close-up of the hands
function personTop(c, turn = 0, outline = false) {
  const st = outline ? `stroke="#0b1a17" stroke-width="5"` : "";
  return `<path d="M-108 -250 C-112 -320 -86 -352 -40 -360 C-20 -364 20 -364 40 -360 C86 -352 112 -320 108 -250 L124 1000 L-124 1000 Z" fill="${c.robe}" ${st}/>
    <path d="M0 -356 L0 1000" stroke="#000" stroke-opacity=".1" stroke-width="3"/>
    <path d="M-108 -250 C-112 -320 -86 -352 -40 -360 L-60 -300 C-80 -260 -84 -100 -94 1000 L-124 1000 Z" fill="#000" opacity=".08"/>
    ${headTop(c, turn, outline)}`;
}
const PAL = [
  { robe: "#4c5d66", hair: "#2a2018", skin: "#a87a52", cap: "#e3d9c2", capShade: "#bfb296" },
  { robe: "#6b5a46", hair: "#231a13", skin: "#97683f", cap: "#d8c49a", capShade: "#b09b6c", turban: true },
  { robe: "#3f5148", hair: "#2a2018", skin: "#a87a52", cap: "#efe8d8", capShade: "#cbc2ad" },
  { robe: "#5e6670", hair: "#30251b", skin: "#8f6340", cap: "#d9cfb8", capShade: "#b5aa90" },
  { robe: "#7a6a52", hair: "#231a13", skin: "#a87a52", cap: "#e9e1cf", capShade: "#c7bea9", turban: true },
  { robe: "#465a6e", hair: "#2a2018", skin: "#97683f", cap: "#d4c7a6", capShade: "#ae9f7c" },
];
const MUAWIYA = { robe: "#f1ece0", hair: "#231a13", skin: "#a87a52", cap: "#d9c08c", capShade: "#b59b62" };

// ---------- one world for every shot: rows of people going forward until they are lost in haze ----------
// Row r = 0 is Mu'awiya's row, r = 1, 2, ... are in front of him (towards the front, which is never seen),
// r = -1 is the row behind, closest to the camera. Perspective: a row at distance z is drawn at scale K/z,
// its shoulder line at y = HOR + Y/z, so the rows shrink towards the horizon line HOR and vanish there.
const HOR = 380, K = 0.78, Y = 880, DZ = 0.36, SP = 265, RMAX = 22;
const zOf = (r) => 1 + r * DZ;
const HAZE = "#3a5a4e";
function rowStyle(r) {
  const z = zOf(r);
  const haze = r <= 0 ? 0 : 1 - Math.exp(-0.2 * r);                     // farther = more haze, at the end nothing but haze
  const blur = r < 0 ? 9 : r === 0 ? 0 : Math.min(7, 1.2 + r * 0.55);     // focus is on Mu'awiya's row
  return { z, s: K / z, y: HOR + Y / z, haze, blur };
}
let FILTERS_READY = false;
function makeFilters() {
  if (FILTERS_READY) return;
  const defs = document.querySelector("#stage defs");
  let f = "";
  for (let r = -1; r <= RMAX; r++) {
    const st = rowStyle(r);
    // mix the row's own colours with the haze colour, then blur it (in the row's own scale)
    f += `<filter id="row${r + 1}" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feFlood flood-color="${HAZE}" result="fog"/><feComposite in="fog" in2="SourceGraphic" operator="in" result="fogShape"/>
      <feComposite in="SourceGraphic" in2="fogShape" operator="arithmetic" k1="0" k2="${(1 - st.haze).toFixed(3)}" k3="${st.haze.toFixed(3)}" k4="0" result="mixed"/>
      <feGaussianBlur in="mixed" stdDeviation="${(st.blur / st.s).toFixed(2)}"/></filter>`;
  }
  defs.insertAdjacentHTML("beforeend", f);
  FILTERS_READY = true;
}
const palOf = (r, j) => PAL[((j * 7 + r * 3) % PAL.length + PAL.length) % PAL.length];
// cam = {zoom, fx, fy}: the world point (fx, fy) is shown at the centre line x = 540, y = sy
function world(t, cam, look, jolt, warm, kind) {
  makeFilters();
  const { zoom, sy } = cam, fx = 540, fy = 1260;
  const toScreen = (x, y) => [540 + (x - fx) * zoom, sy + (y - fy) * zoom];
  let g = "";
  const L = window.PREP ? null : (D.layers || {})[kind];
  const from = window.PREP ? (window.PREP.part === "far" ? RMAX : -1) : (L ? 2 : RMAX);
  const to = window.PREP ? (window.PREP.part === "far" ? 3 : -1) : (L ? 0 : -1);
  for (let r = from; r >= to; r--) {
    const st = rowStyle(r);
    const off = (r % 2 ? 0.5 : 0);
    let row = "";
    const jmax = Math.ceil((620 / zoom) * st.z / SP) + 1;
    for (let j = -jmax; j <= jmax; j++) {
      const x = 540 + (j + off) * SP / st.z;
      const [sx, sy2] = toScreen(x, st.y);
      if (sx < -260 || sx > 1340 || sy2 - 520 * st.s * zoom > 1980 || sy2 < -40) continue;
      const isMu = r === 0 && j === 0;
      let turn = 0;
      if (!isMu && look > 0 && (r === 0 || r === 1 || r === 2) && Math.abs(j + off) <= 2.5) {
        const side = j + off === 0 ? (r % 2 ? 1 : -1) * 0.6 : (j + off < 0 ? 1 : -1);
        turn = side * look * (r === 2 ? 0.7 : 1);
      }
      const jy = (r === 1 && j === 1) ? -jolt * 16 : 0;
      row += `<g transform="translate(${x.toFixed(1)} ${(st.y + jy).toFixed(1)}) scale(${st.s.toFixed(4)})">${isMu ? personTop(MUAWIYA, 0, true) : personTop(palOf(r, j), turn)}</g>`;
    }
    g += `<g filter="url(#row${r + 1})">${row}</g>`;
  }
  const glowY = HOR - 60;
  const W = (inner) => `<g transform="translate(540 ${sy}) scale(${zoom}) translate(${-fx} ${-fy})">${inner}</g>`;
  const glow = `<ellipse cx="540" cy="${glowY}" rx="${900 + 40 * Math.sin(t * 0.5)}" ry="330" fill="url(#glow)" opacity="${0.45 + 0.45 * warm}"/>`;
  const back = `<rect x="-2000" y="-2000" width="5080" height="6000" fill="#10241f"/><rect x="-2000" y="${HOR - 900}" width="5080" height="2600" fill="url(#haze)"/>`;
  if (window.PREP) return window.PREP.part === "far" ? W(back + g) : W(g);
  if (!L) return W(back + glow + g);
  // pre-rendered rows (made at the shot's base zoom), scaled for the slow push-in around the same point
  const push = zoom / CAMS[kind].zoom;
  const tr = `translate(540 ${sy}) scale(${push}) translate(-540 ${-sy})`;
  for (const [gid, iid, src] of [["farL", "farI", L.far], ["nearL", "nearI", L.near]]) {
    const im = $(iid); if (im.getAttribute("href") !== src) im.setAttribute("href", src);
    $(gid).setAttribute("transform", tr); $(gid).style.display = "";
  }
  return W(glow) + W(g);
}
window.prepLayer = (kind, part) => {
  window.PREP = { kind, part };
  document.body.classList.add("prep"); document.documentElement.style.background = "transparent"; document.body.style.background = "transparent";
  const cam = CAMS[kind];
  $("scene").innerHTML = world(0, { zoom: cam.zoom, sy: cam.sy }, 0, 0, 0, kind);
};
window.endPrep = (layers) => { window.PREP = null; document.body.classList.remove("prep"); document.documentElement.style.background = ""; document.body.style.background = ""; D.layers = layers; };
// close-up of the hands: the men either side of Mu'awiya strike their thighs (lift, then a quick slap down)
function hands(t, k, on) {
  const L = PAL[0];
  const swing = (ph) => {
    if (!on) return 0;
    const u = ((t - C.strike) * 1.9 + ph) % 1;
    if (u < 0.55) return ease(u / 0.55);              // lift
    if (u < 0.66) return 1 - (u - 0.55) / 0.11;       // slap down, fast
    return 0;                                          // resting on the thigh
  };
  const impact = (ph) => { if (!on) return 0; const u = ((t - C.strike) * 1.9 + ph) % 1; return u >= 0.66 && u < 0.8 ? 1 - (u - 0.66) / 0.14 : 0; };
  // an arm hanging from the shoulder (above the frame); the forearm turns at the elbow
  const arm = (sx, ex, dir, sleeve, ph) => {
    const a = swing(ph) * 62 * Math.PI / 180, ey = 640, len = 330;
    const wx = ex - dir * Math.sin(a) * 46, wy = ey + Math.cos(a) * len;   // the forearm comes forward (shorter from behind) and a little out, then slaps back down
    const im = impact(ph);
    return `<path d="M${sx} -60 L${ex} ${ey}" stroke="${sleeve}" stroke-width="74" stroke-linecap="round" fill="none"/>
      <path d="M${ex} ${ey} L${wx} ${wy}" stroke="${sleeve}" stroke-width="66" stroke-linecap="round" fill="none"/>
      <path d="M${sx} -60 L${ex} ${ey}" stroke="#000" stroke-opacity=".12" stroke-width="20" transform="translate(${-dir * 24} 0)" fill="none"/>
      <g transform="translate(${wx} ${wy}) rotate(${dir * swing(ph) * 18}) scale(${1 - 0.12 * swing(ph)})">
        <rect x="-36" y="-14" width="72" height="22" rx="8" fill="#000" opacity=".25"/>
        <path d="M-30 4 C-36 50 -26 92 0 104 C24 110 36 86 36 50 C36 30 34 14 30 4 Z" fill="${L.skin}"/>
        <path d="M${dir * 28} 26 C${dir * 46} 42 ${dir * 46} 70 ${dir * 32} 82" stroke="${L.skin}" stroke-width="20" stroke-linecap="round" fill="none"/></g>
      ${im > 0 ? `<g opacity="${im}" stroke="#f6efdc" stroke-width="5" stroke-linecap="round">
        <path d="M${ex - dir * 70} ${ey + len + 30} l${-dir * 34} -10 M${ex - dir * 74} ${ey + len + 70} l${-dir * 38} 0 M${ex - dir * 70} ${ey + len + 110} l${-dir * 34} 10"/></g>` : ""}`;
  };
  return `<g transform="translate(540 960) scale(${1 + 0.03 * k}) translate(-540 -960)">
    <rect x="-40" y="-40" width="1160" height="2000" fill="#10241f"/>
    <rect x="-40" y="-40" width="400" height="2000" fill="${PAL[0].robe}"/>
    <rect x="720" y="-40" width="400" height="2000" fill="${PAL[1].robe}"/>
    <rect x="360" y="-40" width="360" height="2000" fill="#0b1a17"/>
    <rect x="372" y="-40" width="336" height="2000" fill="${MUAWIYA.robe}" stroke="#0b1a17" stroke-width="5"/>
    <path d="M540 -40 L540 1960" stroke="#000" stroke-opacity=".08" stroke-width="4"/>
    ${arm(250, 300, 1, "#3e4d55", 0)}${arm(830, 780, -1, "#5a4a39", 0.37)}
  </g>`;
}
const CAMS = { wide: { zoom: 1, sy: 1260 }, medium: { zoom: 1.6, sy: 1500 }, look: { zoom: 1.25, sy: 1390 } };
function scene(t) {
  const sh = D.shots.find((s) => t >= s.t0 && t < s.t1) || D.shots[D.shots.length - 1];
  const k = clamp((t - sh.t0) / (sh.t1 - sh.t0), 0, 1);
  const look = ramp(t, C.stared, 0.4) * (1 - ramp(t, C.calm - 0.6, 0.5));
  const jolt = Math.exp(-Math.pow((t - C.sneezed) / 0.12, 2));
  const warm = ramp(t, C.calm, 2.5);
  let svg, tag = "";
  $("farL").style.display = "none"; $("nearL").style.display = "none";
  if (sh.kind === "hands") svg = hands(t, k, t >= C.strike && t < C.silence + 0.9);
  else {
    const base = CAMS[sh.kind];
    const cam = { zoom: base.zoom * (1 + 0.04 * k), sy: base.sy };
    svg = world(t, cam, look, jolt, warm, sh.kind);
    if (sh.kind === "medium") tag = nameTag(540, cam.sy - 470 * K * cam.zoom - 34, "Mu'awiya ibn al-Hakam", t, C.mu);
  }
  const cut = 1 - ramp(t, sh.t0, 0.25);
  window.CUT = sh.t0 > 0.1 ? cut : 0;
  return svg + tag;
}

// a small name shown over a person the first time they appear
function nameTag(x, y, text, t, t0) {
  const o = Math.min(ramp(t, t0 + 0.2, 0.35), 1 - ramp(t, t0 + 3.8, 0.4));
  if (o <= 0) return "";
  const w = text.length * 17 + 36;
  return `<g opacity="${o}" transform="translate(${x} ${y - 10 * (1 - ramp(t, t0 + 0.2, 0.35))})">
    <rect x="${-w / 2}" y="-26" width="${w}" height="44" rx="22" fill="#0b1a17" opacity=".78"/>
    <text x="0" y="6" text-anchor="middle" class="nm" fill="#f2dc9c">${text}</text>
    <path d="M-8 18 L0 28 L8 18 Z" fill="#0b1a17" opacity=".78"/></g>`;
}

// ---------- text helpers ----------
function fillWords(el, words, cls) {
  if (el.dataset.ready) return;
  el.dataset.ready = 1; el.innerHTML = "";
  words.forEach((w, i) => {
    const s = document.createElement("span");
    if (w.d.includes("ﷺ")) { const [a, b] = w.d.split("ﷺ"); s.append(a); const g = document.createElement("b"); g.className = "saw"; g.textContent = "ﷺ"; s.append(g, b); }
    else s.textContent = w.d;
    el.appendChild(s); if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
  });
}
function karaoke(el, words, t, mark = "on") {
  el.querySelectorAll("span").forEach((s, i) => { s.classList.toggle("on", t >= words[i].t0 && t < words[i].t1); s.classList.toggle("done", t >= words[i].t1); });
}
function caption(t) {
  const cap = $("cap");
  const ch = D.chunks.find((c) => t >= c.start && t < c.end);
  if (!ch) { cap.innerHTML = ""; cap.dataset.id = ""; return; }
  if (cap.dataset.id !== String(ch.id)) { cap.dataset.id = ch.id; delete cap.dataset.ready; fillWords(cap, ch.words); }
  karaoke(cap, ch.words, t);
  cap.style.opacity = Math.min(ramp(t, ch.start, 0.12), 1 - ramp(t, ch.end - 0.1, 0.1));
}
function card(id, t) {
  const k = D.cards[id], el = $("card_" + id);
  if (!el.dataset.ready) {
    if (k.arabic) el.querySelector(".ar").textContent = k.arabic;
    if (k.lines) el.querySelector(".rows").innerHTML = k.lines.map((l) => `<div class="row"><span class="lab">${l.label}</span><span class="arl">${l.ar}</span></div>`).join("");
    fillWords(el.querySelector(".en"), k.words); el.dataset.ready = 1;
  }
  let o = 0;
  for (const [a, b] of k.show) o = Math.max(o, Math.min(ramp(t, a, 0.35), 1 - ramp(t, b, 0.35)));
  el.style.opacity = o;
  el.style.transform = `translateY(${(1 - o) * 30}px) scale(${0.97 + 0.03 * o})`;
  karaoke(el.querySelector(".en"), k.words, t);
  if (k.lines) {
    el.querySelectorAll(".row").forEach((r, i) => {
      const L = k.lines[i];
      const on = L.times.some(([a, b]) => t >= a && t < b);
      const done = L.times.some(([a]) => t >= a) && !on;
      r.classList.toggle("on", on); r.classList.toggle("done", done && !on);
    });
  }
  return o;
}

window.render = (t) => {
  if (t >= D.outro0 - 0.6) { $("farL").style.display = "none"; $("nearL").style.display = "none"; }
  $("scene").innerHTML = t < D.outro0 - 0.6 ? scene(t) : `<rect width="1080" height="1920" fill="#0b1a17"/><circle cx="540" cy="760" r="520" fill="url(#glow)" opacity=".16"/>`;
  // hook, note, outro: our own words, shown big
  for (const [id, w, a, b] of [["hook", D.hookW, 0.2, D.hookEnd], ["note", D.noteW, D.note0 - 0.4, D.note1], ["outro", D.outroW, D.outro0 - 0.4, D.end0]]) {
    const el = $(id); fillWords(el, w); karaoke(el, w, t);
    el.style.opacity = Math.min(ramp(t, a, 0.4), 1 - ramp(t, b, 0.4));
  }
  const yar = $("yar"); yar.textContent = D.yar.arabic;
  yar.style.opacity = Math.min(ramp(t, D.yar.t0 - 0.1, 0.3), 1 - ramp(t, D.yar.t1, 0.5));
  yar.style.transform = `translateY(${(1 - ramp(t, D.yar.t0 - 0.1, 0.5)) * 24}px)`;
  let co = 0;
  for (const id of ["teacher", "three", "words"]) co = Math.max(co, card(id, t));
  $("dim").setAttribute("opacity", Math.max(window.CUT || 0, 0.62 * co, 0.45 * Math.min(ramp(t, 0.1, 0.3), 1 - ramp(t, D.hookEnd, 0.4)), 0.55 * ramp(t, D.note0 - 0.6, 0.4)));
  caption(t);
  $("logo").style.opacity = ramp(t, D.end0 + 0.2, 0.6);
  $("black").style.opacity = 1 - ramp(t, 0, 0.35);
};
window.ready = document.fonts.ready.then(() => true);
</script>

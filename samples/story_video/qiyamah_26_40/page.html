<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Poppins'; src: url('file://__REPO__/samples/story_video/kahf_turning/fonts/Poppins-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Poppins'; src: url('file://__REPO__/samples/story_video/kahf_turning/fonts/Poppins-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Amiri'; src: url('file://__REPO__/assets/fonts/Amiri-Regular.ttf'); }
@font-face { font-family: 'Hafs'; src: url('file://__REPO__/assets/fonts/KFGQPC-UthmanicHafs-v18.ttf'); }
@font-face { font-family: 'Marcellus'; src: url('file://__REPO__/assets/fonts/Marcellus-Regular.ttf'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #08201b; }
#bg { position: absolute; inset: 0; background: url('file://__REPO__/assets/reel_background.png') center/cover; }
#shade { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 60% at 50% 45%, rgba(6,26,22,.30), rgba(4,16,13,.85)); }
canvas { position: absolute; left: 0; top: 0; }
.abs { position: absolute; left: 0; right: 0; text-align: center; }
#head { top: 150px; }
#head .mk { width: 92px; height: 116px; margin: 0 auto; overflow: hidden; position: relative; }
#head .mk img { position: absolute; width: 180px; left: -44px; top: -32px; }
#head .ar { font: 400 54px/1.2 Amiri; color: #e8c66a; margin-top: 36px; }
#head .en { font: 500 21px Poppins; letter-spacing: 6px; color: rgba(232,198,106,.8); margin-top: 6px; }
.vs { position: absolute; left: 0; right: 0; top: 760px; text-align: center; padding: 0 70px; }
.vs .ar { font: 400 74px/1.75 Hafs; direction: rtl; }
.vs .num { font: 400 46px Amiri; color: #e8c66a; margin: 0 10px; display: inline-block; }
.vs .rule { width: 260px; height: 1.5px; margin: 10px auto 28px; background: linear-gradient(90deg, transparent, rgba(232,198,106,.7), transparent); position: relative; }
.vs .rule::after { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #e8c66a; }
.vs .en { font: 500 42px/1.4 Poppins; color: #f1ede2; }
#pill { position: absolute; left: 50%; top: 1700px; transform: translateX(-50%); width: 660px; height: 104px; border-radius: 60px;
  border: 1.5px solid rgba(232,198,106,.35); background: rgba(6,24,20,.55); display: flex; align-items: center; padding: 0 26px; box-sizing: border-box; }
#pill .lg { width: 66px; height: 66px; border-radius: 50%; border: 1.5px solid rgba(232,198,106,.6); overflow: hidden; position: relative; flex: none; }
#pill .lg img { position: absolute; width: 104px; left: -19px; top: -14px; }
#pill .tx { margin-left: 18px; text-align: left; flex: 1; }
#pill .t1 { font: 700 26px Poppins; color: #f1ede2; white-space: nowrap; } #pill .t2 { font: 500 19px Poppins; color: rgba(225,236,230,.55); white-space: nowrap; }
#bars { display: flex; gap: 7px; align-items: center; height: 60px; }
#bars i { display: block; width: 6px; border-radius: 3px; background: #7fd6b0; }
#logoBox { position: absolute; left: 0; right: 0; top: 560px; text-align: center; opacity: 0; }
#logoBox .frame { width: 560px; height: 360px; overflow: hidden; margin: 0 auto; position: relative; }
#logoBox img { position: absolute; left: 0; top: -104px; width: 560px; visibility: hidden; }
</style></head>
<body>
<div id="bg"></div><div id="shade"></div>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="abs" id="head"><div class="mk"><img src="file://__MARK__"></div><div class="ar">سُورَةُ القِيَامَةِ</div><div class="en">SURAH AL-QIYAMAH · 75:26–40</div></div>
<div id="verses"></div>
<div id="pill"><div class="lg"><img src="file://__MARK__"></div><div class="tx"><div class="t1">The Halal Algorithm</div><div class="t2">@thehalalalgorithm</div></div><div id="bars"></div></div>
<div id="logoBox"><div class="frame" id="logoFrame"></div>
  <div style="font-family:Marcellus;letter-spacing:8px;color:#e8c66a;font-size:44px;margin-top:40px">THE HALAL ALGORITHM</div>
  <div style="font-family:Marcellus;letter-spacing:4px;color:#f6efdc;font-size:34px;margin-top:44px;border:2px solid #e8c66a;display:inline-block;padding:14px 38px;border-radius:40px">+ FOLLOW</div></div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ramp = (t, t0, d = .4) => ease((t - t0) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const cv = $("cv"), g = cv.getContext("2d");
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

// verse blocks; every Arabic word its own span so it can light with the recitation
const V = D.verses.map(v => { const el = document.createElement("div"); el.className = "vs";
  const ar = document.createElement("div"); ar.className = "ar";
  const sp = v.ar.split(" ").map((w, i) => { const s = document.createElement("span"); s.textContent = w; if (i) ar.appendChild(document.createTextNode(" ")); ar.appendChild(s); return s; });
  const num = document.createElement("span"); num.className = "num"; num.textContent = "﴿" + AR(v.n) + "﴾"; ar.appendChild(document.createTextNode(" ")); ar.appendChild(num);
  el.appendChild(ar); el.insertAdjacentHTML("beforeend", `<div class="rule"></div><div class="en">${v.en}</div>`);
  $("verses").appendChild(el); return { ...v, el, sp }; });
for (let i = 0; i < 14; i++) $("bars").appendChild(document.createElement("i"));
const bars = [...$("bars").children];
const logoImgs = D.logo.map(s => { const i = document.createElement("img"); i.src = "file://" + s; $("logoFrame").appendChild(i); return i; });

// soft glow dot
function glow(x, y, r, col, a) { if (a <= 0) return; g.save(); g.globalAlpha = a;
  let gr = g.createRadialGradient(x, y, 0, x, y, r * 6); gr.addColorStop(0, col.replace("A", .55)); gr.addColorStop(1, col.replace("A", 0)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 6, 0, 7); g.fill();
  gr = g.createRadialGradient(x, y, 0, x, y, r * 1.6); gr.addColorStop(0, "rgba(255,255,255,.95)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.6, 0, 7); g.fill(); g.restore(); }
const TEAL = "rgba(127,214,176,A)", GOLD = "rgba(242,200,98,A)", PALE = "rgba(230,240,225,A)";
const rnd = (i, k = 0) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const MY = 1330;   // motif centre line

// one small scene per verse, drawn under the text (u = seconds into the verse, d = its length, a = opacity)
const M = {
  26(u, d, a) { // heart monitor: the bright dot runs left to right and draws the trace; older trace fades behind it
    const beat = x => { const k = ((x % 360) + 360) % 360 / 360; return k > .40 && k < .56 ? (k < .44 ? -(k - .40) * 1500 : k < .48 ? -60 + (k - .44) * 4000 : k < .52 ? 100 - (k - .48) * 3200 : -28 + (k - .52) * 700) : 0; };
    const head = 60 + u * 230, W = 1080 + 260; g.save(); g.lineWidth = 3; g.lineCap = "round"; g.shadowColor = "#7fd6b0"; g.shadowBlur = 14;
    for (let x = head - 760; x < head; x += 4) { const f = (x - (head - 760)) / 760, xx = ((x % W) + W) % W - 130, xn = (((x + 4) % W) + W) % W - 130; if (xn < xx) continue;
      g.strokeStyle = `rgba(127,214,176,${a * .9 * f * f})`; g.beginPath(); g.moveTo(xx, MY + beat(x)); g.lineTo(xn, MY + beat(x + 4)); g.stroke(); }
    g.restore(); const hx = ((head % W) + W) % W - 130; glow(hx, MY + beat(head), 7, TEAL, a); },
  27(u, d, a) { for (let i = 0; i < 7; i++) { const x = 140 + rnd(i) * 800 + 60 * Math.sin(u * .5 + i), y = MY - 140 + rnd(i, 1) * 300 + 30 * Math.cos(u * .4 + i * 2);
      glow(x, y, 3 + rnd(i, 2) * 3, PALE, a * (.35 + .35 * Math.sin(u * 1.3 + i * 1.7))); } },
  28(u, d, a) { const s = ease(u / d); g.save(); g.globalAlpha = a * .35; g.strokeStyle = "rgba(230,240,225,.5)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(540 - 40 - s * 300, MY); g.lineTo(540 + 40 + s * 300, MY); g.stroke(); g.restore();
    glow(540 - 40 - s * 300, MY, 8, TEAL, a); glow(540 + 40 + s * 300, MY, 8, GOLD, a); },
  29(u, d, a) { for (let k = 0; k < 2; k++) for (let x = 60; x <= 1020; x += 16) { const ph = x / 95 - u * 1.6 + k * Math.PI, y = MY + Math.sin(ph) * 70, z = Math.cos(ph);
      g.fillStyle = (k ? GOLD : TEAL).replace("A", a * (.35 + .45 * (z + 1) / 2)); g.beginPath(); g.arc(x, y, 2.4 + 1.6 * (z + 1) / 2, 0, 7); g.fill(); } },
  30(u, d, a) { const s = ease(u / d), y = lerp(MY + 150, MY - 170, s); glow(540, y, 9 + 6 * s, GOLD, a);
    g.save(); g.globalAlpha = a * .3; const gr = g.createLinearGradient(0, MY + 160, 0, y); gr.addColorStop(0, "rgba(242,200,98,0)"); gr.addColorStop(1, "rgba(242,200,98,.6)"); g.fillStyle = gr; g.fillRect(538.5, y, 3, MY + 160 - y); g.restore(); },
  31(u, d, a) { const s = ease(u / d); glow(540, MY - 60 + s * 120, 8, PALE, a * (1 - .7 * s)); },
  32(u, d, a) { const s = ease(u / d); for (let i = 0; i < 9; i++) glow(540 + (s * 520) * (1 - i * .08), MY + Math.sin(i) * 4, 6 - i * .5, PALE, a * (1 - s * .6) * (1 - i * .1)); },
  33(u, d, a) { g.save(); for (let i = 0; i < 46; i++) { const y = MY - 260 + rnd(i) * 520, sp = 160 + rnd(i, 1) * 260, L = 30 + rnd(i, 2) * 70, x = ((rnd(i, 3) * 1400 + u * sp) % 1400) - 160;
      g.strokeStyle = PALE.replace("A", a * (.18 + rnd(i, 4) * .35)); g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + L, y); g.stroke(); } g.restore(); },
  34(u, d, a) { mist(u, a * .8, 0); }, 35(u, d, a) { mist(u, a, 1); },
  36(u, d, a) { mist(u, a * .55, 2); for (let i = 0; i < 26; i++) glow(100 + rnd(i) * 880, MY - 300 + ((rnd(i, 1) * 600 + u * 14) % 600), 1.6, PALE, a * .5 * rnd(i, 2)); },
  37(u, d, a) { // a drop falls (speeding up), touches the surface with a soft flash, rings are born small and grow out one by one
    const T = 1.25, f = clamp(u / T), y = lerp(MY - 300, MY, f * f);
    if (u < T + .25) glow(540, y, 6 * (1 - .5 * clamp((u - T) / .25)), PALE, a * (1 - clamp((u - T) / .25)));
    if (u > T) { const fl = clamp((u - T) / .6); glow(540, MY, 10, TEAL, a * .8 * Math.sin(Math.PI * fl));
      for (let k = 0; k < 6; k++) { const tb = T + k * .55; if (u < tb) continue; const q = (u - tb) / 3.2; if (q > 1) continue;
        const r = 6 + 240 * (1 - Math.pow(1 - q, 2.2)), al = a * .65 * clamp((u - tb) / .3) * (1 - q) * (1 - q);
        g.strokeStyle = TEAL.replace("A", al); g.lineWidth = 2.2 * (1 - q) + .6; g.beginPath(); g.ellipse(540, MY, r * 1.25, r * .32, 0, 0, 7); g.stroke(); } } },
  38(u, d, a) { const s = ease(u / (d * .8)); dots(540, s, a, 0); },
  39(u, d, a) { const s = ease(u / (d * .8)); dots(540 - 150 * s, 1, a, 1, .72); dots(540 + 150 * s, 1, a, 2, .72); },
  40(u, d, a) { // dawn, drawn on its own layer and faded out towards the text: the horizon warms first, then the sun climbs from
    // behind the far hill; soft blurred light shafts, a warm haze band, four hill layers (far ones paler, rims lit near the sun), rising motes
    const c = oc, G = c.getContext("2d"); G.setTransform(1, 0, 0, 1, 0, 0); G.clearRect(0, 0, 1080, 1920);
    const pre = ease(u / 2.2), s = ease((u - .6) / 6.5), HZ = 1585, sx = 540, sy = lerp(HZ + 60, HZ - 165, s);
    let gr = G.createLinearGradient(0, 860, 0, HZ + 30);
    gr.addColorStop(0, "rgba(242,200,98,0)"); gr.addColorStop(.55, `rgba(205,150,80,${.08 * pre + .06 * s})`); gr.addColorStop(.86, `rgba(240,185,110,${.16 * pre + .2 * s})`); gr.addColorStop(1, `rgba(255,214,150,${.25 * pre + .35 * s})`);
    G.fillStyle = gr; G.fillRect(0, 860, 1080, HZ + 30 - 860);
    gr = G.createRadialGradient(sx, sy, 0, sx, sy, 950); gr.addColorStop(0, `rgba(255,234,175,${.42 * s + .1 * pre})`); gr.addColorStop(.22, `rgba(248,198,120,${.16 * s + .05 * pre})`); gr.addColorStop(1, "rgba(242,200,98,0)");
    G.fillStyle = gr; G.fillRect(0, 700, 1080, 1220);
    G.save(); G.filter = "blur(9px)"; G.globalCompositeOperation = "lighter";
    for (let k = 0; k < 15; k++) { const an = -Math.PI / 2 + (rnd(k, 11) - .5) * 2.6 + .035 * Math.sin(u * .22 + k), w = .018 + .045 * rnd(k, 12), L = (650 + 520 * rnd(k, 13)) * (.35 + .65 * s);
      const al = (.07 + .09 * rnd(k, 14)) * s * (.65 + .35 * Math.sin(u * .55 + k * 1.9));
      const rg = G.createLinearGradient(sx, sy, sx + Math.cos(an) * L, sy + Math.sin(an) * L); rg.addColorStop(0, `rgba(255,232,170,${al})`); rg.addColorStop(.6, `rgba(255,224,160,${al * .4})`); rg.addColorStop(1, "rgba(255,224,160,0)");
      G.fillStyle = rg; G.beginPath(); G.moveTo(sx, sy); G.lineTo(sx + Math.cos(an - w) * L, sy + Math.sin(an - w) * L); G.lineTo(sx + Math.cos(an + w) * L, sy + Math.sin(an + w) * L); G.fill(); }
    G.restore();
    gr = G.createRadialGradient(sx, sy, 0, sx, sy, 150); gr.addColorStop(0, `rgba(255,246,220,${.85 * s + .15})`); gr.addColorStop(.28, `rgba(255,226,150,${.45 * s})`); gr.addColorStop(1, "rgba(255,214,140,0)");
    G.fillStyle = gr; G.beginPath(); G.arc(sx, sy, 150, 0, 7); G.fill();
    gr = G.createRadialGradient(sx, sy, 0, sx, sy, 40); gr.addColorStop(0, "rgba(255,253,244,1)"); gr.addColorStop(.75, "rgba(255,244,214,.97)"); gr.addColorStop(1, "rgba(255,230,170,0)");
    G.fillStyle = gr; G.beginPath(); G.arc(sx, sy, 40, 0, 7); G.fill();
    G.save(); G.filter = "blur(14px)"; gr = G.createLinearGradient(0, HZ - 70, 0, HZ + 70); gr.addColorStop(0, "rgba(255,220,160,0)"); gr.addColorStop(.5, `rgba(255,214,150,${.10 + .22 * s})`); gr.addColorStop(1, "rgba(255,220,160,0)");
    G.fillStyle = gr; G.fillRect(-40, HZ - 70, 1160, 140); G.restore();
    const layers = [[HZ, 22, 260, .7, [30, 52, 42], .75], [HZ + 55, 34, 190, 1.9, [18, 40, 33], .5], [HZ + 120, 44, 150, 3.4, [10, 30, 24], .3], [HZ + 205, 30, 230, 5.1, [6, 21, 17], .14]];
    layers.forEach(([base, amp, wv, ph, col, rim], li) => {
      const top = x => base + amp * Math.sin(x / wv + ph) + amp * .42 * Math.sin(x / (wv * .37) + ph * 1.7) + amp * .15 * Math.sin(x / (wv * .13) + ph);
      const warm = (3 - li) / 3 * (.1 + .4 * s);   // far hills take the colour of the haze
      G.fillStyle = `rgb(${col[0] + 120 * warm * .5 | 0},${col[1] + 80 * warm * .5 | 0},${col[2] + 30 * warm * .5 | 0})`;
      G.beginPath(); G.moveTo(-10, 1920); for (let x = -10; x <= 1090; x += 8) G.lineTo(x, top(x)); G.lineTo(1090, 1920); G.fill();
      G.lineWidth = li ? 1.8 : 2.4;
      for (let x = -10; x < 1090; x += 8) { const near = Math.exp(-Math.pow((x - sx) / (260 + li * 90), 2)); G.strokeStyle = `rgba(255,218,150,${rim * s * (.18 + .82 * near)})`;
        G.beginPath(); G.moveTo(x, top(x)); G.lineTo(x + 8, top(x + 8)); G.stroke(); }
      if (li < 2) { G.save(); G.filter = "blur(10px)"; const mg = G.createLinearGradient(0, base + 10, 0, base + 90); mg.addColorStop(0, `rgba(230,200,150,${.10 * s})`); mg.addColorStop(1, "rgba(230,200,150,0)"); G.fillStyle = mg; G.fillRect(-40, base + 10, 1160, 80); G.restore(); }
    });
    for (let i = 0; i < 34; i++) { const life = (u * (.10 + rnd(i, 6) * .12) + rnd(i, 7)) % 1, my = HZ - 20 - life * 520, mx = 120 + rnd(i, 8) * 840 + 18 * Math.sin(u * .7 + i);
      G.fillStyle = `rgba(255,236,190,${.55 * s * Math.sin(Math.PI * life)})`; G.beginPath(); G.arc(mx, my, 1.1 + rnd(i, 9) * 1.6, 0, 7); G.fill(); }
    G.globalCompositeOperation = "destination-in"; gr = G.createLinearGradient(0, 960, 0, 1260); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,1)");
    G.fillStyle = gr; G.fillRect(0, 0, 1080, 1920); G.globalCompositeOperation = "source-over";
    g.save(); g.globalAlpha = a; g.drawImage(c, 0, 0); g.restore(); },
};
function mist(u, a, seed) { g.save(); for (let i = 0; i < 9; i++) { const x = 540 + (rnd(i, seed) - .5) * 900 + 40 * Math.sin(u * .3 + i), y = MY - 120 + (rnd(i, seed + 5) - .5) * 360, r = 180 + rnd(i, seed + 9) * 160;
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(170,200,185,${.10 * a})`); gr.addColorStop(1, "rgba(170,200,185,0)"); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); } g.restore(); }
const PTS = Array.from({ length: 260 }, (_, i) => { const z = 1 - 2 * (i + .5) / 260, r = Math.sqrt(1 - z * z), th = i * 2.39996; return [r * Math.cos(th), z, r * Math.sin(th)]; });
function dots(cx, s, a, seed, sc = 1) { const R = 150 * sc, rot = performanceT * .35 + seed;
  for (let i = 0; i < PTS.length; i++) { const [x0, y0, z0] = PTS[i], x = x0 * Math.cos(rot) + z0 * Math.sin(rot), z = -x0 * Math.sin(rot) + z0 * Math.cos(rot);
    const sx = lerp(cx + (rnd(i, seed) - .5) * 900, cx + x * R, s), sy = lerp(MY + (rnd(i, seed + 3) - .5) * 600, MY + y0 * R, s);
    g.fillStyle = PALE.replace("A", a * (.25 + .5 * (z + 1) / 2)); g.beginPath(); g.arc(sx, sy, 1.6 + 1.4 * (z + 1) / 2, 0, 7); g.fill(); } }
let performanceT = 0;
const oc = document.createElement("canvas"); oc.width = 1080; oc.height = 1920;

function render(t) {
  performanceT = t; g.clearRect(0, 0, 1080, 1920);
  const out = 1 - ramp(t, D.logo - .5, .5);
  // drifting dust over the whole frame
  for (let i = 0; i < 60; i++) { const x = rnd(i, 7) * 1080 + 20 * Math.sin(t * .2 + i), y = ((rnd(i, 8) * 1920 - t * (6 + rnd(i, 9) * 10)) % 1920 + 1920) % 1920;
    g.fillStyle = `rgba(230,240,225,${(.12 + .2 * rnd(i, 4)) * out})`; g.beginPath(); g.arc(x, y, 1 + rnd(i, 5) * 1.6, 0, 7); g.fill(); }
  V.forEach((v, k) => {
    const a = ramp(t, v.t0 - .35, .45) * (1 - ramp(t, v.t1 - .2, .4)) * out;
    v.el.style.opacity = a;
    if (a > 0) { M[v.n]?.(t - v.t0, v.t1 - v.t0, a);
      v.sp.forEach((sp, i) => { const w = v.words[i];   // soft: dim gold -> gold, a glow that swells in and fades out
        const k1 = ramp(t, w.s - .15, .35), k2 = ramp(t, w.s - .15, .35) * (1 - ramp(t, w.e - .1, .7));
        sp.style.color = `rgba(${243 + 12 * k2 | 0},${192 + 51 * k2 | 0},${79 + 128 * k2 | 0},${.32 + .68 * k1})`;
        sp.style.textShadow = k2 > .01 ? `0 0 ${28 * k2}px rgba(243,192,79,${.9 * k2}), 0 0 9px rgba(243,192,79,${.9 * k2})` : "none"; }); }
  });
  $("head").style.opacity = ramp(t, .1, .6) * out; $("pill").style.opacity = ramp(t, .3, .6) * out;
  const lv = D.env[clamp(Math.floor(t * 30), 0, D.env.length - 1)] || 0;
  bars.forEach((b, i) => { const h = 10 + 44 * clamp(lv * (.55 + .45 * Math.abs(Math.sin(i * 1.7 + t * 9))), 0, 1); b.style.height = h + "px"; b.style.opacity = .5 + .5 * lv; });
  $("logoBox").style.opacity = ramp(t, D.logo, .4);
  const fr = clamp(Math.floor((t - D.logo) * 30), 0, logoImgs.length - 1); logoImgs.forEach((im, i) => im.style.visibility = i === fr ? "visible" : "hidden");
}
window.render = render;
function fit() { V.forEach(v => { const ar = v.el.querySelector('.ar'); let fs = 74; ar.style.fontSize = fs + 'px'; v.el.style.opacity = 1;
  while (ar.offsetHeight > fs * 1.75 * 1.3 && fs > 44) { fs -= 2; ar.style.fontSize = fs + 'px'; } v.el.style.opacity = 0; }); }
window.ready = Promise.all([document.fonts.ready, ...logoImgs.map(i => i.decode().catch(() => 0))]).then(() => { fit(); render(0); return true; });
</script></body></html>

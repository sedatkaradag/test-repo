<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Poppins'; src: url('file://__REPO__/samples/story_video/kahf_turning/fonts/Poppins-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Poppins'; src: url('file://__REPO__/samples/story_video/kahf_turning/fonts/Poppins-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Garamond'; src: url('file://__REPO__/assets/fonts/EBGaramond[wght].ttf'); font-weight: 400 800; }
@font-face { font-family: 'Hafs'; src: url('file://__REPO__/assets/fonts/KFGQPC-UthmanicHafs-v18.ttf'); }
@font-face { font-family: 'Marcellus'; src: url('file://__REPO__/assets/fonts/Marcellus-Regular.ttf'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #08201b; }
#bg { position: absolute; inset: 0; background: url('file://__REPO__/assets/reel_background.png') center/cover; }
#shade { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 60% at 50% 42%, rgba(6,26,22,.25), rgba(4,16,13,.82)); }
.abs { position: absolute; left: 0; right: 0; text-align: center; }
#title { top: 380px; font: 700 92px Poppins; color: #f4efe2; letter-spacing: -1px; }
#round { top: 512px; } #round span { font: 700 25px Poppins; letter-spacing: 4px; color: #0b2a22; background: #e8c66a; border-radius: 30px; padding: 9px 26px; }
.rd { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.card { position: absolute; left: 90px; width: 900px; top: 600px; box-sizing: border-box; padding: 56px 56px 84px; border-radius: 36px;
  background: rgba(7,30,25,.72); border: 2.5px solid rgba(232,198,106,.75); box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center; }
.card .qm { position: absolute; font: 700 120px/1 Garamond; color: #e8c66a; }
.card .qm.o { right: 34px; top: 8px; transform: scaleX(-1); }
.card .qm.c { left: 34px; bottom: -48px; transform: scaleX(-1); }
.card .ar { font: 400 72px/1.75 Hafs; direction: rtl; }
.card .en { font: italic 500 40px/1.38 Garamond; color: #eae5d6; margin-top: 18px; }
.opts { position: absolute; left: 90px; width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.op { height: 124px; border-radius: 26px; background: rgba(240,236,224,.95); display: flex; align-items: center; padding: 0 30px; gap: 22px; box-sizing: border-box; position: relative; }
.op .b { width: 50px; height: 50px; border-radius: 50%; background: #0f3a2f; color: #f4efe2; font: 700 25px/50px Poppins; text-align: center; flex: none; }
.op .n { font: 700 40px/1.1 Poppins; color: #0f3a2f; } .op .p { font: 500 19px Poppins; color: rgba(15,58,47,.62); margin-top: 3px; letter-spacing: .3px; }
.op.right .p { color: rgba(255,255,255,.8); }
.op.right { background: #1f8a5b; } .op.right .n { color: #fff; } .op.right .b { background: #fff; color: #1f8a5b; }
.status { position: absolute; left: 0; right: 0; text-align: center; font: 500 34px Poppins; color: rgba(240,236,224,.8); }
.bar { position: absolute; left: 240px; width: 600px; height: 14px; border-radius: 8px; background: rgba(240,236,224,.18); overflow: hidden; }
.bar i { display: block; height: 100%; background: #e8c66a; border-radius: 8px; }
.who { position: absolute; left: 0; right: 0; text-align: center; font: 700 38px Poppins; color: #7fe0b0; }
.foot { position: absolute; left: 0; right: 0; text-align: center; font: 500 25px Poppins; color: rgba(240,236,224,.5); }
#mark { position: absolute; left: 0; right: 0; top: 1790px; text-align: center; font: 22px Marcellus; letter-spacing: 6px; color: rgba(201,176,122,.7); }
#logoBox { position: absolute; left: 0; right: 0; top: 560px; text-align: center; opacity: 0; }
#logoBox .frame { width: 560px; height: 360px; overflow: hidden; margin: 0 auto; position: relative; }
#logoBox img { position: absolute; left: 0; top: -104px; width: 560px; visibility: hidden; }
</style></head>
<body>
<div id="bg"></div><div id="shade"></div>
<div class="abs" id="title">Who said it?</div>
<div class="abs" id="round"><span id="roundT">ROUND 1 / 3</span></div>
<div id="rounds"></div>
<div id="mark">THE HALAL ALGORITHM</div>
<div id="logoBox"><div class="frame" id="logoFrame"></div>
  <div style="font-family:Marcellus;letter-spacing:8px;color:#e8c66a;font-size:44px;margin-top:40px">THE HALAL ALGORITHM</div>
  <div style="font-family:Marcellus;letter-spacing:4px;color:#f6efdc;font-size:34px;margin-top:44px;border:2px solid #e8c66a;display:inline-block;padding:14px 38px;border-radius:40px">+ FOLLOW</div></div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ramp = (t, t0, d = .4) => ease((t - t0) / d);
const R = D.rounds.map((r, k) => {
  const el = document.createElement("div"); el.className = "rd";
  el.innerHTML = `<div class="card"><div class="qm o">“</div><div class="qm c">”</div><div class="ar"></div><div class="en">${r.en_open ? "“" + r.en + "”" : r.en + "”"}</div></div>
    <div class="opts">${r.options.map((o, i) => `<div class="op"><div class="b">${"ABCD"[i]}</div><div><div class="n">${o}</div><div class="p">(Peace be upon him)</div></div></div>`).join("")}</div>
    <div class="status">Listen…</div><div class="bar"><i></i></div><div class="who">${r.who}</div><div class="foot"></div>`;
  $("rounds").appendChild(el);
  const ar = el.querySelector(".ar");
  const sp = r.ar.split(" ").map((w, i) => { const s = document.createElement("span"); s.textContent = w; if (i) ar.appendChild(document.createTextNode(" ")); ar.appendChild(s); return s; });
  return { ...r, el, sp, card: el.querySelector(".card"), ops: [...el.querySelectorAll(".op")], status: el.querySelector(".status"), bar: el.querySelector(".bar"), fill: el.querySelector(".bar i"),
    who: el.querySelector(".who"), foot: el.querySelector(".foot"), arEl: ar };
});
function layout() { R.forEach(r => { r.el.style.opacity = 1; let fs = 72; r.arEl.style.fontSize = fs + "px";
  while (r.card.offsetHeight > 640 && fs > 50) { fs -= 2; r.arEl.style.fontSize = fs + "px"; }
  const y = 600 + r.card.offsetHeight + 60; r.el.querySelector(".opts").style.top = y + "px";
  const y2 = y + 2 * 124 + 26 + 60; r.status.style.top = y2 + 22 + "px"; r.bar.style.top = y2 + "px"; r.who.style.top = y2 + "px"; r.foot.style.top = y2 + 110 + "px"; r.el.style.opacity = 0; }); }
const logoImgs = D.logo_frames.map(s => { const i = document.createElement("img"); i.src = "file://" + s; $("logoFrame").appendChild(i); return i; });

function render(t) {
  const out = 1 - ramp(t, D.logo - .5, .5);
  $("title").style.opacity = ramp(t, .05, .5) * out; $("round").style.opacity = ramp(t, .15, .5) * out; $("mark").style.opacity = .8 * ramp(t, .3, .6) * out;
  let cur = 0; R.forEach((r, k) => { if (t >= r.t0 - .3) cur = k; });
  $("roundT").textContent = `ROUND ${cur + 1} / ${R.length}`;
  R.forEach((r, k) => {
    const a = ramp(t, r.t0 - .5, .5) * (k < R.length - 1 ? 1 - ramp(t, r.t1 - .45, .45) : out);
    r.el.style.opacity = a; if (a <= 0) return;
    r.el.style.transform = `translateY(${(1 - ramp(t, r.t0 - .5, .5)) * 30}px)`;
    r.sp.forEach((sp, i) => { const w = r.words[i];   // our soft word light: dim gold -> gold, current word glows (0.35 s in, 0.7 s out)
      const k1 = ramp(t, w.s - .15, .35), k2 = ramp(t, w.s - .15, .35) * (1 - ramp(t, w.e - .1, .7));
      sp.style.color = `rgba(${243 + 12 * k2 | 0},${192 + 51 * k2 | 0},${79 + 128 * k2 | 0},${.32 + .68 * k1})`;
      sp.style.textShadow = k2 > .01 ? `0 0 ${28 * k2}px rgba(243,192,79,${.9 * k2}), 0 0 9px rgba(243,192,79,${.9 * k2})` : "none"; });
    const th = ramp(t, r.think, .3), rv = ramp(t, r.reveal, .35);
    r.status.style.opacity = (1 - th) * 1; r.bar.style.opacity = th * (1 - rv);
    r.fill.style.width = (100 * clamp((t - r.think) / (r.reveal - r.think))) + "%";
    r.who.style.opacity = rv;
    r.ops.forEach((o, i) => { const right = i === r.answer; o.classList.toggle("right", right && t >= r.reveal);
      o.style.opacity = right ? 1 : 1 - .6 * rv; o.style.transform = right ? `scale(${1 + .05 * Math.sin(Math.PI * clamp((t - r.reveal) / .5))})` : "none";
      o.querySelector(".b").textContent = right && t >= r.reveal ? "✓" : "ABCD"[i]; });
    r.foot.textContent = t >= r.reveal ? `${r.ref} · ${r.reciter}` : `Recited by ${r.reciter}`;
  });
  $("logoBox").style.opacity = ramp(t, D.logo, .4);
  const fr = clamp(Math.floor((t - D.logo) * 30), 0, logoImgs.length - 1); logoImgs.forEach((im, i) => im.style.visibility = i === fr ? "visible" : "hidden");
}
window.render = render;
window.ready = Promise.all([document.fonts.ready, ...logoImgs.map(i => i.decode().catch(() => 0))]).then(() => { layout(); render(0); return true; });
</script></body></html>

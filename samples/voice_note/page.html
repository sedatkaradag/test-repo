const D = window.DATA;
const T = D.T;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ramp = (t, a, d) => clamp((t - a) / d, 0, 1);
const ease = (x) => x * x * (3 - 2 * x);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// phrases: Arabic word ranges + their English part
const arBox = $('ar'), enBox = $('en');
const phr = D.phrases.map((p) => {
  const a = document.createElement('div'); a.className = 'ph';
  p.words.forEach((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = D.words[w]; a.appendChild(s); if (i < p.words.length - 1) a.appendChild(document.createTextNode(' ')); });
  arBox.appendChild(a);
  const e = document.createElement('div'); e.className = 'ph';
  const ew = p.english.split(' ');
  ew.forEach((w, i) => { const s = document.createElement('span'); s.textContent = w; e.appendChild(s); if (i < ew.length - 1) e.appendChild(document.createTextNode(' ')); });
  enBox.appendChild(e);
  return { a, e, aw: [...a.querySelectorAll('span')], ew: [...e.querySelectorAll('span')], words: p.words, map: p.map };
});
$('ref').textContent = D.ref;
const logos = D.logo.map((src) => { const im = new Image(); im.src = src; return im; });
function drawWave(cv, levels, color, dim) {
  const g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height);
  const n = levels.length, bw = cv.width / n;
  for (let i = 0; i < n; i++) { const h = Math.max(6, levels[i] * cv.height); g.fillStyle = color; g.fillRect(i * bw + bw * 0.22, (cv.height - h) / 2, bw * 0.56, h); }
}
const vbars = []; { const n = 34, L = D.env.length; for (let i = 0; i < n; i++) { const a = Math.floor(i * L / n), b = Math.floor((i + 1) * L / n); let m = 0; for (let j = a; j < b; j++) m = Math.max(m, D.env[j]); vbars.push(0.2 + 0.8 * m); } }

window.render = function (t) {
  // ---- intro ----
  const iz = ramp(t, T.zoom0, T.zoom1 - T.zoom0);
  const intro = $('intro');
  intro.style.opacity = 1 - ramp(t, T.zoom0 + 0.25, 0.4);
  intro.style.transformOrigin = `563px 1268px`;
  intro.style.transform = `scale(${1 + 5 * ease(iz)})`;
  $('panelA').style.opacity = ease(ramp(t, 0, 0.45));
  $('panelA').style.transform = `translateY(${(1 - ease(ramp(t, 0, 0.6))) * 40}px)`;
  $('panelB').style.opacity = ease(ramp(t, 0.35, 0.45));
  $('panelB').style.transform = `translateY(${(1 - ease(ramp(t, 0.35, 0.6))) * 40}px)`;
  document.querySelectorAll('.stars circle').forEach((c, i) => c.setAttribute('opacity', 0.45 + 0.55 * Math.abs(Math.sin(t * 1.7 + i * 1.3))));
  document.querySelectorAll('.bulbs circle').forEach((c, i) => c.setAttribute('opacity', 0.55 + 0.45 * Math.abs(Math.sin(t * 2.2 + i * 0.8))));
  $('glowHim').setAttribute('opacity', 0.75 + 0.25 * Math.sin(t * 5));
  $('lantGlow').setAttribute('opacity', 0.8 + 0.2 * Math.sin(t * 2.7));
  // him: each message is typed in a bubble, the bubble turns into a heart, the heart flies to her phone
  const VB = (x, y, top) => [60 + x * 1.1071 - 51.4, top + y * 1.1071];
  const phone = VB(500, 298, 935);
  let act = -1;
  D.msgs.forEach((m, k) => { if (t >= m.dots0) act = k; });
  const bub = $('bub'), bt = $('btext');
  let bubOp = 0, bubSc = 1, heartOp = 0, hx = 0, hy = 0, hs = 1, sparkOp = 0, bx = 520, by = 150, bl = 1;
  if (act >= 0) {
    const m = D.msgs[act];
    // typed letter by letter; a long message goes on two lines (the bubble grows upward, the tail stays put);
    // the heart is typed as the last character, the same heart that arrives in her chat
    const lines = m.lines || [m.text], tot = lines.join('').length, L = tot + (m.heart ? 1 : 0);
    const n = t < m.type0 ? 0 : Math.min(L, Math.ceil((t - m.type0) / (m.type1 - m.type0) * L));
    $('dots').setAttribute('opacity', t < m.type0 ? 1 : 0);
    const shown = []; let left = Math.min(n, tot);
    lines.forEach((ln, k) => { if (k === 0 || left > 0) { shown.push(ln.slice(0, left)); } left -= Math.min(left, ln.length); });
    const hOn = m.heart && n > tot;
    bl = Math.max(1, shown.length);
    const els = [bt, $('btext2')];
    let wmax = 0, tl = 0;
    els.forEach((el, k) => { el.textContent = shown[k] || ''; el.setAttribute('y', 9 - 34 * (bl - 1 - k)); const lw = el.textContent ? el.getComputedTextLength() : 0; if (k === bl - 1) tl = lw; wmax = Math.max(wmax, lw + (k === bl - 1 && hOn ? 38 : 0)); });
    $('bheart').setAttribute('opacity', hOn ? 1 : 0);
    $('bheart').setAttribute('transform', `translate(${26 + tl + 22} 0) scale(0.75)`);
    const w = n > 0 ? wmax + 52 : 130;
    $('brect').setAttribute('width', Math.max(130, w));
    $('brect').setAttribute('y', -36 - 34 * (bl - 1)); $('brect').setAttribute('height', 72 + 34 * (bl - 1));
    bubOp = ramp(t, m.dots0, 0.2) * (1 - ramp(t, m.morph, m.fly0 - m.morph));
    bubSc = (0.7 + 0.3 * back(ramp(t, m.dots0, 0.3))) * (1 - 0.5 * ease(ramp(t, m.morph, m.fly0 - m.morph)));
    const c0 = VB(bx + Math.max(130, w) / 2 * bubSc, by - 17 * (bl - 1) * bubSc, 285);
    if (t >= m.morph && t < m.fly1 + 0.35) {
      const g = ramp(t, m.morph, m.fly0 - m.morph), f = ease(ramp(t, m.fly0, m.fly1 - m.fly0));
      const cx = (c0[0] + phone[0]) / 2 + 300, cy = (c0[1] + phone[1]) / 2 - 40;
      hx = (1 - f) * (1 - f) * c0[0] + 2 * (1 - f) * f * cx + f * f * phone[0];
      hy = (1 - f) * (1 - f) * c0[1] + 2 * (1 - f) * f * cy + f * f * phone[1];
      hs = (0.3 + 0.9 * back(g)) * (1 - 0.6 * f);
      heartOp = t < m.fly1 ? Math.min(1, g * 2) : 0;
      sparkOp = t >= m.fly1 ? 1 - ramp(t, m.fly1, 0.35) : 0;
    }
  }
  document.querySelectorAll('#bub .td').forEach((d, i) => { d.setAttribute('transform', `translate(0 ${-7 * Math.max(0, Math.sin(t * 9 - i * 0.9))})`); });
  bub.setAttribute('transform', `translate(${bx} ${by}) scale(${bubSc})`);
  bub.setAttribute('opacity', bubOp);
  $('fheart').setAttribute('transform', `translate(${hx} ${hy}) scale(${hs})`);
  $('fheart').setAttribute('opacity', heartOp);
  const sp = act >= 0 ? ramp(t, D.msgs[act].fly1, 0.35) : 0;
  $('spark').setAttribute('transform', `translate(${phone[0]} ${phone[1]}) scale(${0.6 + 1.2 * sp})`);
  $('spark').setAttribute('opacity', sparkOp);
  // her: phone lights and the notification shows the latest message
  const a1 = D.msgs[0].fly1, a2 = D.msgs[D.msgs.length - 1].fly1;
  const nt = ramp(t, a1, 0.45), nt2 = ramp(t, a2, 0.35);
  const latest = t >= a2 ? D.msgs[D.msgs.length - 1] : D.msgs[0];
  $('nbody').textContent = latest.text;
  $('ntitle').textContent = t >= a2 ? 'unknown · 2 messages' : 'unknown';
  const nl = $('nbody').getComputedTextLength();
  $('nheart').setAttribute('opacity', latest.heart ? 1 : 0);
  $('nheart').setAttribute('transform', `translate(${-72 + nl + 16} 14) scale(0.55)`);
  const nw = Math.max(300, nl + 110 + (latest.heart ? 26 : 0));
  $('nrect').setAttribute('width', nw); $('nrect').setAttribute('x', -150);
  const bump = t >= a2 ? 1 + 0.08 * Math.sin(Math.PI * nt2) : 1;
  $('notif').setAttribute('transform', `translate(566 ${150 - 30 * ease(nt)}) scale(${(0.6 + 0.4 * back(nt)) * bump})`);
  $('notif').setAttribute('opacity', nt > 0 ? Math.min(1, nt * 3) * (1 - ramp(t, T.zoom0 - 0.1, 0.25)) : 0);
  const lit = t >= a1 ? 1 : 0;
  $('screenHer').setAttribute('fill', lit ? '#c9f5e8' : '#1a2a27');
  $('glowHer').setAttribute('opacity', lit * (0.75 + 0.25 * Math.sin(t * 6)));
  $('her').setAttribute('transform', `translate(0 ${-3 * ease(ramp(t, a2 + 0.3, 0.6))})`);

  // ---- chat ----
  const chat = $('chat');
  const cIn = ramp(t, T.zoom0 + 0.25, 0.45);
  chat.style.opacity = cIn;
  chat.style.transform = `scale(${0.94 + 0.06 * ease(cIn)})`;
  const recOn = ramp(t, T.rec0, 0.35) * (1 - ramp(t, T.rel, 0.3));
  chat.style.filter = recOn > 0 ? `blur(${8 * recOn}px) brightness(${1 - 0.7 * recOn})` : 'none';
  const pop = (id, at) => { const k = ramp(t, at, 0.28); const el = $(id); el.style.opacity = k; el.style.transform = `scale(${0.85 + 0.15 * (k > 0 ? back(k) : 0)})`; };
  pop('m1', T.m1); pop('m2', T.m2); pop('m3', T.rel + 0.1);
  const pulse = t >= T.m2 + 0.4 && t < T.rec0;
  $('mic').style.transform = `scale(${pulse ? 1 + 0.08 * Math.sin((t - T.m2) * 10) : 1})`;
  $('mic').style.background = pulse ? '#c9a660' : '#12302a';
  $('inputbar').style.opacity = 1 - recOn;
  drawWave($('vwave'), vbars, '#e8cf8e');
  $('vdur').textContent = D.vdur;

  // ---- recording ----
  $('rec').style.opacity = recOn;
  const ta = (t - T.a0) * 1000;
  // which phrase is on screen: from its first word's start (or the recording start for the first)
  let cur = 0;
  phr.forEach((p, k) => { if (ta >= D.seg[p.words[0]][2] - 120) cur = k; });
  phr.forEach((p, k) => {
    const show = k === cur ? 1 : 0;
    p.a.style.opacity = show; p.e.style.opacity = show;
    p.aw.forEach((sp, i) => { const [ , , s, e] = D.seg[p.words[i]]; const on = ta >= s; const now = ta >= s && ta < e;
      sp.style.opacity = on ? 1 : 0.3; sp.style.color = now ? '#f6dc93' : ''; sp.style.textShadow = now ? '0 0 30px rgba(246,220,147,.55)' : 'none'; });
    // English: the words that translate the Arabic word being read are lit in gold; what was read stays ivory
    let lastOn = -1, now = -1;
    p.words.forEach((w, i) => { const [ , , s, e] = D.seg[w]; if (ta >= s) lastOn = i; if (ta >= s && ta < e) now = i; });
    const done = new Set(); for (let i = 0; i <= lastOn; i++) p.map[i].forEach((j) => done.add(j));
    p.ew.forEach((sp, j) => {
      const inNow = now >= 0 && p.map[now].includes(j);
      sp.style.opacity = done.has(j) ? 1 : 0.3;
      sp.style.color = inNow ? '#f6dc93' : '';
      sp.style.textShadow = inNow ? '0 0 24px rgba(246,220,147,.5)' : 'none';
    });
  });
  const fi = Math.max(0, Math.round((t - T.a0) * 30));
  const lv = []; for (let i = 47; i >= 0; i--) { const j = fi - i; lv.push(j >= 0 && j < D.env.length ? D.env[j] : 0.05); }
  drawWave($('wave'), lv, '#1c1606');
  $('timer').textContent = `0:${String(Math.max(0, Math.floor(t - T.rec0))).padStart(2, '0')}`;
  $('recdot').style.opacity = 0.4 + 0.6 * Math.abs(Math.sin(t * 3));

  // ---- fade to black, end ----
  $('black').style.opacity = ramp(t, T.fade0, 0.5);
  $('end').style.opacity = ramp(t, T.end0, 0.4);
  const li = clamp(Math.floor((t - T.end0 - 0.15) * 30), 0, logos.length - 1);
  $('endlogo').src = logos[li].src;
  $('endlogo').style.opacity = t >= T.end0 + 0.15 ? 1 : 0;
  document.querySelectorAll('#end .nm, #end .pill, #end .hd').forEach((el, i) => { el.style.opacity = ease(ramp(t, T.end0 + 1.7 + i * 0.25, 0.5)); });
};
window.ready = Promise.all([document.fonts.ready, ...logos.map((im) => im.decode().catch(() => 0)), ...[...document.querySelectorAll('image')].map(() => new Promise((r) => setTimeout(r, 400)))]);
</script>
</body></html>

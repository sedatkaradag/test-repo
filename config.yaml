# --- The Halal Algorithm bot settings ---

account: thehalalalgorithm
handle: "@thehalalalgorithm"

# Her paylaşım bu dakikanın ± kadar rastgele kaydırılır (hep aynı dakikada gitmesin).
jitter_minutes: 5

# Paylaşım saatleri. Her slot kendi saat diliminde tanımlıdır, yaz/kış saati
# geçişleri otomatik hesaplanır. `type` o slota hangi türün gireceğini belirler
# (enqueue.py bunu zorunlu tutar).
# 28 Ekim 2026'dan itibaren: günde 2 fotoğraf (ayet + hadis) ve 3 Reels (aşağıda).
# `from` / `until`: slotun kullanıldığı ilk / son yerel gün (geçiş için).
slots:
  # Avrupa sabahı (işe gidiş) — ABD uyurken
  - name: eu-morning
    time: "08:15"
    tz: Europe/Berlin
    type: quran
  # Avrupa öğleden sonrası = ABD sabahı
  - name: us-morning
    time: "09:00"
    tz: America/New_York
    type: hadith
  # Eski düzen: 27 Ekim'de kuyruktaki onaylı gönderiler için son kez. Bu saatlerde artık Reels var.
  - name: eu-evening-us-noon
    time: "13:00"
    tz: America/New_York
    type: quran
    until: "2026-10-27"
  - name: us-evening
    time: "20:30"
    tz: America/New_York
    type: hadith
    until: "2026-10-27"

# true  -> paylaşmaz, sadece kuyruğu işaretler (önizleme ana ajandan istenir)
# false -> Instagram'a gerçekten paylaşır
dry_run: false

# Günde 3 Reels (28 Ekim'den itibaren): 2 tilavetli ayet, 1 sessiz hadis. Her Reels kendi
# ayet/hadisini taşır, hiçbir gönderinin kopyası değildir. Şablon v2 (scripts/reels.py):
# ayet ayet altın, hadis parça parça gümüş. `content`: o slota girecek tür.
# trial: true -> önce sadece takipçi olmayanlara gösterilir (deneme Reels).
# Instagram deneme Reels için asgari takipçi sayısı istiyor; hesap o eşiğe
# ulaşana kadar false (normal Reels). Eşik aşılınca true yapılacak.
reels:
  enabled: true
  trial: false
  # Ayet Reels'lerinde o ayetlerin tilaveti ses olarak eklenir (müzik yok). Kâriler sırayla
  # döner; caption'ın en altına "Recitation: <ad>" yazılır. Ses everyayah.com'dan (ayet ayet)
  # GitHub'da indirilir; video orada her ayetin gerçek süresiyle çizilir. Hadis Reels'leri sessizdir.
  recitation:
    enabled: true
    max_seconds: 75
    reciters:
      - {id: Alafasy_128kbps, name: Mishary Alafasy}
      - {id: Abdul_Basit_Murattal_192kbps, name: Abdul Basit Abdus-Samad}
      - {id: Husary_128kbps, name: Mahmoud Khalil Al-Husary}
      - {id: Minshawy_Murattal_128kbps, name: Mohamed Siddiq Al-Minshawi}
      - {id: MaherAlMuaiqly128kbps, name: Maher Al-Muaiqly}
  slots:
    # Eski tek Reels slotu: 27 Ekim'deki onaylı Reels için son kez.
    - {name: reel, time: "11:00", tz: America/New_York, until: "2026-10-27"}
    # Pakistan ve Hindistan akşamı (20:30 Karaçi = 21:00 Hindistan; Avrupa öğleden sonrası)
    - {name: reel-pk, time: "20:30", tz: Asia/Karachi, content: quran, from: "2026-10-28"}
    # Avrupa akşamı = ABD öğle arası (ilk Reels'in iyi gittiği saat)
    - {name: reel-eu, time: "13:00", tz: America/New_York, content: quran, from: "2026-10-28"}
    # ABD akşam prime-time
    - {name: reel-us, time: "20:30", tz: America/New_York, content: hadith, from: "2026-10-28"}

# Haftada 1 carousel: tek temada 5 metin + kapak kartı (Çarşamba 18:00 New York).
carousel:
  enabled: true
  slot:
    name: carousel
    time: "18:00"
    tz: America/New_York
    weekday: 2        # 0=Pazartesi ... 6=Pazar

# true -> her gönderi paylaşıldıktan hemen sonra Story olarak da paylaşılır
stories: true

# true -> hiçbir şey paylaşılmaz (acil durdurma)
paused: false

# Aynı ayet/hadis bu kadar gün içinde tekrar paylaşılmaz
repeat_days: 365

# Instagram Graph API sürümü ("" = sürümsüz uç nokta)
api_version: "v26.0"

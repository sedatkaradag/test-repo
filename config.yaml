# --- The Halal Algorithm bot settings ---

account: thehalalalgorithm
handle: "@thehalalalgorithm"

# Her paylaşım bu dakikanın ± kadar rastgele kaydırılır (hep aynı dakikada gitmesin).
jitter_minutes: 5

# Paylaşım saatleri. Her slot kendi saat diliminde tanımlıdır, yaz/kış saati
# geçişleri otomatik hesaplanır. `type` o slota hangi türün gireceğini belirler
# (enqueue.py bunu zorunlu tutar).
# 30 Ekim 2026'dan itibaren fotoğraf gönderisi yok: günde 4 Reels (aşağıda) ve haftalık carousel.
# İsteğe bağlı `from` / `until`: slotun kullanıldığı ilk / son yerel gün (geçişler için).
slots:
  # Eski fotoğraf slotları: 29 Ekim'de son kez.
  - name: eu-morning
    time: "08:15"
    tz: Europe/Berlin
    type: quran
    until: "2026-10-29"
  - name: us-morning
    time: "09:00"
    tz: America/New_York
    type: hadith
    until: "2026-10-29"

# true  -> paylaşmaz, sadece kuyruğu işaretler (önizleme ana ajandan istenir)
# false -> Instagram'a gerçekten paylaşır
dry_run: false

# Günde 4 Reels (30 Ekim'den itibaren): 3 tilavetli ayet, 1 sessiz hadis. Her Reels kendi
# ayet/hadisini taşır, hiçbir gönderinin kopyası değildir. Şablon v2 (scripts/reels.py):
# ayet ayet altın, hadis parça parça gümüş. `content`: o slota girecek tür.
# trial: true -> önce sadece takipçi olmayanlara gösterilir (deneme Reels).
# Instagram deneme Reels için asgari takipçi sayısı istiyor; hesap o eşiğe
# ulaşana kadar false (normal Reels). Eşik aşılınca true yapılacak.
reels:
  enabled: true
  trial: false
  # Bu andan itibaren (UTC; 30 Ekim 2026 00:00 İstanbul) her Reels yayınlanınca aynı video Story
  # olarak da paylaşılır (60 saniyeden uzunsa Story atlanır; Reels hiçbir durumda etkilenmez).
  stories_from: "2026-10-29T21:00:00Z"
  # Ayet Reels'lerinde ve ayet gönderilerinin Story'sinde o ayetlerin tilaveti ses olarak eklenir
  # (müzik yok); caption'ın en altına "Recitation: <ad>" yazılır. Kâriler ağırlıklı sırayla döner:
  # `weight` ne kadar yüksekse o kadar sık (son 30 tilavetteki payı ağırlığına göre), aynı kâri art
  # arda gelmez. Ağırlıklar popülerliğe göre: en çok dinlenen ve sosyal medyada en çok paylaşılan
  # sesler önde. Analist izlenme süresine göre değiştirebilir. Ses everyayah.com'dan (ayet ayet)
  # GitHub'da indirilir; video orada her ayetin gerçek süresiyle çizilir. Hadis Reels'leri sessizdir.
  recitation:
    enabled: true
    max_seconds: 75
    reciters:
      - {id: Alafasy_128kbps, name: Mishary Alafasy, weight: 4}
      - {id: Abdul_Basit_Murattal_192kbps, name: Abdul Basit Abdus-Samad, weight: 3}
      - {id: MaherAlMuaiqly128kbps, name: Maher Al-Muaiqly, weight: 3}
      - {id: Yasser_Ad-Dussary_128kbps, name: Yasser Al-Dosari, weight: 3}
      - {id: Abdurrahmaan_As-Sudais_192kbps, name: Abdul Rahman Al-Sudais, weight: 2}
      - {id: Minshawy_Murattal_128kbps, name: Mohamed Siddiq Al-Minshawi, weight: 1}
      - {id: ahmed_ibn_ali_al_ajamy_128kbps, name: Ahmed Al-Ajmi, weight: 1}
      - {id: Husary_128kbps, name: Mahmoud Khalil Al-Husary, weight: 1}
  slots:
    # Avrupa sabahı (işe gidiş), ABD uyurken
    - {name: reel-eu-am, time: "08:15", tz: Europe/Berlin, content: quran, from: "2026-10-30"}
    # Pakistan ve Hindistan akşamı (20:30 Karaçi = 21:00 Hindistan; Avrupa öğleden sonrası)
    - {name: reel-pk, time: "20:30", tz: Asia/Karachi, content: quran}
    # Avrupa akşamı = ABD öğle arası (ilk Reels'in iyi gittiği saat)
    - {name: reel-eu, time: "13:00", tz: America/New_York, content: quran}
    # ABD akşam prime-time
    - {name: reel-us, time: "20:30", tz: America/New_York, content: hadith}

# Haftada 1 carousel: tek temada 5 metin + kapak kartı (Çarşamba 18:00 New York).
carousel:
  enabled: true
  slot:
    name: carousel
    time: "18:00"
    tz: America/New_York
    weekday: 2        # 0=Pazartesi ... 6=Pazar

# true -> her gönderi paylaşıldıktan hemen sonra Story olarak da paylaşılır
stories: true

# true -> hiçbir şey paylaşılmaz (acil durdurma)
paused: false

# Aynı ayet/hadis bu kadar gün içinde tekrar paylaşılmaz
repeat_days: 365

# Instagram Graph API sürümü ("" = sürümsüz uç nokta)
api_version: "v26.0"

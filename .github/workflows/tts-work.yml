name: tts-work
# Temporary, branch tts-work only: makes an English narration with Kokoro (free, open source). Writes nothing to the repo.
on:
  push:
    branches: [tts-work]
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
      - run: pip install -q "kokoro>=0.9.4" soundfile
      - run: python tts/make_tts.py bm_george 0.95
      - uses: actions/upload-artifact@v4
        with: {name: tts-out, path: out/}

name: weekly

on:
  schedule:
    - cron: "41 3 * * 1"   # Mondays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights-and-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml

      - name: Refresh Instagram token (long-lived tokens last ~60 days)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | python -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$new" ]; then
            echo "refresh failed"
            curl -s -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ Instagram token refresh failed. Renew it manually." \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" > /dev/null || true
            exit 0
          fi
          if [ -n "$GH_TOKEN" ] && [ "$new" != "$IG_ACCESS_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --body "$new" --repo "$GITHUB_REPOSITORY"
            echo "token rotated"
          else
            echo "token refreshed"
          fi

      - name: Pull insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/insights.py

      - name: Commit
        run: |
          git config user.name "halal-algorithm-bot"
          git config user.email "halal-algorithm-bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -m "weekly insights" && git push)
